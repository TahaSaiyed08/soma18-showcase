<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="t d">
<title id="t">From browsing to watching in five steps</title>
<desc id="d">Five steps in a row, joined by a line of light that fills from left to right: Browse, Sign in, Pay, Unlock, Watch. Each step lights up and gets a check mark in turn, then the whole row stays lit before starting again.</desc>
