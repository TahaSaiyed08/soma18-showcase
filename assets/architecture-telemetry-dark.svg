<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
<title id="t">How the Soma18 site is put together</title>
<desc id="d">A visitor connects to the site on Cloudflare. From there, four services branch out: Clerk for login, Stripe for payments, Stream for videos and D1 for the database. Small lights travel along the lines and each service pulses when one arrives.</desc>
