<svg xmlns="http://www.w3.org/2000/svg" width="232" height="40" viewBox="0 0 232 40" role="img" aria-labelledby="t d">
<title id="t">Live at soma18.ca</title>
<desc id="d">A badge that says Live at soma18.ca, with a pulsing dot.</desc>
<style>
.sans{font-family:-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}
.static{display:none}

.rad{transform-box:fill-box;transform-origin:center;opacity:0;animation:rad 3s cubic-bezier(0.22, 1, 0.36, 1) infinite}.r2{animation-delay:.6s}
@keyframes rad{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.2);opacity:0}}

@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important}
  .smil{display:none !important}
  .static{display:inline !important}
  
}
</style>
<defs>
<linearGradient id="spec" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.95"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>

</defs>
<rect x="0.5" y="0.5" width="231" height="39" rx="19.5" fill="#F6F7F3" stroke="#CFD6CF"/>
<rect x="20" y="0.5" width="192" height="1" fill="url(#spec)"/>
<circle class="rad r1" cx="24" cy="20" r="5" fill="none" stroke="#0E6569" stroke-width="1.5"/>
<circle class="rad r2" cx="24" cy="20" r="5" fill="none" stroke="#0E6569" stroke-width="1"/>
<circle cx="24" cy="20" r="4.5" fill="#0E6569"/>
