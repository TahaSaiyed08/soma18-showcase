<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
<title id="t">Soma18 client showcase banner</title>
<desc id="d">The word Soma18 beside a slowly breathing ring around the number 18, with two tilted orbits and counter-rotating dashed rings. Below the title: A daily 18-minute mind-body practice. Website, hosting, online store. Built and maintained by Taha Saiyed.</desc>
<style>
.sans{font-family:-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}
.static{display:none}

.breath{transform-box:fill-box;transform-origin:center;animation:breath 18s cubic-bezier(0.45,0,0.55,1) infinite}
@keyframes breath{0%,100%{transform:scale(1)}45%{transform:scale(1.045)}55%{transform:scale(1.045)}}
.orbA{animation:orbA 9s linear infinite}.orbB{animation:orbB 12s linear infinite}
@keyframes orbA{to{stroke-dashoffset:-100}}@keyframes orbB{to{stroke-dashoffset:100}}

.aurora{filter:url(#fx)}
.blob{transform-box:fill-box;transform-origin:center}
.b1{animation:d1 18s ease-in-out infinite alternate}.b2{animation:d2 12s ease-in-out infinite alternate}.b3{animation:d3 9s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(-60px,36px) scale(1.12)}}@keyframes d2{to{transform:translate(-80px,-40px) scale(0.9)}}@keyframes d3{to{transform:translate(90px,-30px) scale(1.2)}}
.rv{transform-box:fill-box;transform-origin:left center;animation:rv 1.4s cubic-bezier(0.22, 1, 0.36, 1) both}
.rv1{animation-delay:.15s}.rv2{animation-delay:1.1s}.rv3{animation-delay:1.45s}
@keyframes rv{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.title{stroke-dasharray:900;paint-order:stroke;animation:ink 2.6s cubic-bezier(0.22, 1, 0.36, 1) both}
@keyframes ink{0%{stroke-dashoffset:900;fill-opacity:0;stroke-opacity:1}55%{stroke-dashoffset:0;fill-opacity:0;stroke-opacity:1}100%{stroke-dashoffset:0;fill-opacity:1;stroke-opacity:0}}
.title{stroke-opacity:0}
.eyebrow{animation:fade 1.2s cubic-bezier(0.22, 1, 0.36, 1) both}.rule{transform-box:fill-box;transform-origin:left center;animation:rv 1.2s cubic-bezier(0.22, 1, 0.36, 1) 1.8s both}
@keyframes fade{from{opacity:0}to{opacity:1}}

@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important}
  .smil{display:none !important}
  .static{display:inline !important}
  .aurora{filter:url(#fxS)}
}
</style>
<defs>
<linearGradient id="spec" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.34"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
<radialGradient id="rglow"><stop offset="0" stop-color="#5FC2C6" stop-opacity="0.55"/><stop offset="0.55" stop-color="#5FC2C6" stop-opacity="0.08"/><stop offset="1" stop-color="#5FC2C6" stop-opacity="0"/></radialGradient>
<filter id="fx" x="-10%" y="-30%" width="120%" height="160%" color-interpolation-filters="sRGB">
<feTurbulence type="fractalNoise" baseFrequency="0.006 0.011" numOctaves="2" seed="18" result="n"><animate attributeName="baseFrequency" dur="36s" values="0.006 0.011;0.010 0.007;0.006 0.011" repeatCount="indefinite"/></feTurbulence>
<feDisplacementMap in="SourceGraphic" in2="n" scale="80" xChannelSelector="R" yChannelSelector="G"/>
<feGaussianBlur stdDeviation="26"/><feColorMatrix type="saturate" values="1.25"/></filter>
<filter id="fxS" x="-10%" y="-30%" width="120%" height="160%" color-interpolation-filters="sRGB">
<feTurbulence type="fractalNoise" baseFrequency="0.006 0.011" numOctaves="2" seed="18" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="80" xChannelSelector="R" yChannelSelector="G"/>
<feGaussianBlur stdDeviation="26"/><feColorMatrix type="saturate" values="1.25"/></filter>
<clipPath id="c1"><rect class="rv rv1" x="56" y="84" width="560" height="96"/></clipPath>
<clipPath id="c2"><rect class="rv rv2" x="56" y="186" width="620" height="34"/></clipPath>
<clipPath id="c3"><rect class="rv rv3" x="56" y="226" width="620" height="30"/></clipPath>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#2A3742"/></pattern>
</defs>
<clipPath id="pc"><rect x="0.5" y="0.5" width="1199" height="339" rx="12"/></clipPath>
<rect x="0.5" y="0.5" width="1199" height="339" rx="12" fill="#0F151B"/>
<g clip-path="url(#pc)">
<rect width="1200" height="340" fill="url(#dots)" opacity="0.55"/>
<g class="aurora" opacity="0.50">
<ellipse class="blob b1" cx="860" cy="120" rx="210" ry="90" fill="#5FC2C6"/>
<ellipse class="blob b2" cx="1010" cy="230" rx="170" ry="80" fill="#F0B33C"/>
<ellipse class="blob b3" cx="720" cy="250" rx="150" ry="60" fill="#A6E6E8"/>
</g>
<g transform="translate(948 170)"><g class="smil"><g transform="scale(1.1)">
<circle r="150" fill="url(#rglow)"/>
<g transform="rotate(-24)"><ellipse rx="132" ry="44" fill="none" stroke="#2A3742" stroke-width="1"/><ellipse class="orbA" rx="132" ry="44" fill="none" stroke="#5FC2C6" stroke-width="1.5" pathLength="100" stroke-dasharray="14 86" stroke-linecap="round"/><circle r="3.2" fill="#5FC2C6"><animateMotion dur="9s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear" path="M-132 0a132 44 0 1 0 264 0a132 44 0 1 0 -264 0"/></circle></g>
<g transform="rotate(24)"><ellipse rx="132" ry="44" fill="none" stroke="#2A3742" stroke-width="1"/><ellipse class="orbB" rx="132" ry="44" fill="none" stroke="#F0B33C" stroke-width="1.5" pathLength="100" stroke-dasharray="9 91" stroke-linecap="round"/><circle r="3.2" fill="#F0B33C"><animateMotion dur="12s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear" path="M-132 0a132 44 0 1 0 264 0a132 44 0 1 0 -264 0"/></circle></g>
<g class="breath">
<circle r="112" fill="none" stroke="#2A3742" stroke-width="1"/>
<g><circle r="112" fill="none" stroke="#5FC2C6" stroke-width="1.5" pathLength="180" stroke-dasharray="6.667 3.333" opacity="0.9"/><animateTransform attributeName="transform" type="rotate" calcMode="spline" keyTimes="0;1" keySplines="0.45 0 0.55 1" values="0;360" dur="36s" repeatCount="indefinite"/></g>
<g><circle r="98" fill="none" stroke="#9AA7A6" stroke-width="1" pathLength="180" stroke-dasharray="0.6 4.4" opacity="0.8"/><animateTransform attributeName="transform" type="rotate" values="0;-360" dur="54s" repeatCount="indefinite"/></g>
<g><circle r="84" fill="none" stroke="#F0B33C" stroke-width="1.5" pathLength="180" stroke-dasharray="45 15" stroke-linecap="round"/><animateTransform attributeName="transform" type="rotate" calcMode="spline" keyTimes="0;1" keySplines="0.45 0 0.55 1" values="0;-360" dur="18s" repeatCount="indefinite"/></g>
<circle r="66" fill="#161F27" stroke="#2A3742" stroke-width="1"/>
<path d="M-46.7 -46.7A66 66 0 0 1 46.7 -46.7" fill="none" stroke="url(#spec)" stroke-width="1"/>
<text class="sans" y="24" text-anchor="middle" font-size="68" font-weight="700" letter-spacing="-2" fill="#E8EAE5">18</text>
</g>
</g></g><g class="static"><g transform="scale(1.1)">
<circle r="150" fill="url(#rglow)"/>
<g transform="rotate(-24)"><ellipse rx="132" ry="44" fill="none" stroke="#2A3742" stroke-width="1"/><ellipse class="orbA" rx="132" ry="44" fill="none" stroke="#5FC2C6" stroke-width="1.5" pathLength="100" stroke-dasharray="14 86" stroke-linecap="round"/><circle cx="93" cy="31" r="3.2" fill="#5FC2C6"/></g>
<g transform="rotate(24)"><ellipse rx="132" ry="44" fill="none" stroke="#2A3742" stroke-width="1"/><ellipse class="orbB" rx="132" ry="44" fill="none" stroke="#F0B33C" stroke-width="1.5" pathLength="100" stroke-dasharray="9 91" stroke-linecap="round"/><circle cx="-93" cy="31" r="3.2" fill="#F0B33C"/></g>
<g class="breath">
<circle r="112" fill="none" stroke="#2A3742" stroke-width="1"/>
<g><circle r="112" fill="none" stroke="#5FC2C6" stroke-width="1.5" pathLength="180" stroke-dasharray="6.667 3.333" opacity="0.9"/></g>
<g><circle r="98" fill="none" stroke="#9AA7A6" stroke-width="1" pathLength="180" stroke-dasharray="0.6 4.4" opacity="0.8"/></g>
<g><circle r="84" fill="none" stroke="#F0B33C" stroke-width="1.5" pathLength="180" stroke-dasharray="45 15" stroke-linecap="round"/></g>
<circle r="66" fill="#161F27" stroke="#2A3742" stroke-width="1"/>
<path d="M-46.7 -46.7A66 66 0 0 1 46.7 -46.7" fill="none" stroke="url(#spec)" stroke-width="1"/>
<text class="sans" y="24" text-anchor="middle" font-size="68" font-weight="700" letter-spacing="-2" fill="#E8EAE5">18</text>
</g>
</g></g></g>
<text class="mono eyebrow" x="60" y="72" font-size="13" letter-spacing="2.6" fill="#5FC2C6">CLIENT SHOWCASE</text>
<g clip-path="url(#c1)"><text class="sans title" x="56" y="162" font-size="86" font-weight="700" letter-spacing="-3" fill="#E8EAE5" stroke="#5FC2C6" stroke-width="1.5">Soma18</text></g>
<g clip-path="url(#c2)"><text class="sans" x="60" y="210" font-size="23" font-weight="500" fill="#E8EAE5">A daily 18-minute mind-body practice.</text></g>
<g clip-path="url(#c3)"><text class="mono" x="60" y="246" font-size="15" letter-spacing="0.6" fill="#9AA7A6">Website  ·  Hosting  ·  Online store</text></g>
<rect class="rule" x="60" y="272" width="72" height="2" rx="1" fill="#F0B33C"/>
<text class="mono" x="60" y="304" font-size="12" letter-spacing="1.4" fill="#9AA7A6">BUILT AND MAINTAINED BY TAHA SAIYED</text></g>
<rect x="0.5" y="0.5" width="1199" height="339" rx="12" fill="none" stroke="#2A3742"/>
<rect x="14" y="0.5" width="1172" height="1" fill="url(#spec)"/>
</svg>
